[package]
name = "rainbreak"
version = "1.2.0"
description = "雨やどり / Rainbreak — 通り雨で休む作業タイマー"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# 透過ウィンドウ（macos-private-api）とトレイ（tray-icon）を使う。
tauri = { version = "2.12.0", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-global-shortcut = "2.3.2"
# 自動アップデート（GitHub Releases の latest.json を参照）と確認ダイアログ。
tauri-plugin-updater = "2.10.1"
tauri-plugin-dialog = "2.7.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["time", "rt", "macros", "sync"] }

# 時間の真実（状態機械）は Tauri 非依存のコアクレートに分離（テスト容易性）。
rainbreak-core = { path = "../crates/core" }

# モードB: 雨ガラスの屈折元に使う画面キャプチャ（capture_screen コマンド）。
# image は JPEG エンコードにだけ使うので既定フォーマット群（avif 等）は外す。
xcap = "0.9.6"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
base64 = "0.23.1"

# macOS: 全画面 Space 共存（collectionBehavior）とキャプチャ除外（sharingType）。
# tao が露出しない NSWindow 属性を直接設定する（macos.rs / 要件 §11 Gate 1）。
# バージョンは tao/wry が使うものと同一系列（Cargo.lock 上で 1 本に揃う）。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSResponder",
    "NSWindow",
] }

# Windows: セッション単位の入力経過時間・画面ロック状態の読み取り。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }

[features]
# 既定。Tauri テンプレート互換のためのプレースホルダ。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
