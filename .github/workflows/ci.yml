name: ci

on:
  push:
    branches: [main]
  pull_request:

# 同一 PR/ブランチの古い実行はキャンセルし、push と pull_request の二重起動も防ぐ。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 時間の真実（状態機械）の単体テスト。webkit 不要。
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: crates/core -> target
          # PR/タグ実行では保存しない（Windows の post cache 保存フレーク回避）。
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --manifest-path crates/core/Cargo.toml -- --check
      - run: cargo test --manifest-path crates/core/Cargo.toml

  # フロント（SvelteKit SPA）の型チェックと静的ビルド。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/gen-assets.mjs
      - run: pnpm run check
      - run: pnpm run build

  # Tauri シェルのコンパイル検証（macOS / Windows は webkit 不要）。
  app-build:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: src-tauri -> target
          # PR/タグ実行では保存しない（Windows の post cache 保存フレーク回避）。
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check
      - run: pnpm install --frozen-lockfile
      - run: node tools/gen-assets.mjs
      - run: pnpm tauri icon app-icon.png
      - run: pnpm run build
      - run: cargo build --manifest-path src-tauri/Cargo.toml

  # 依存の既知脆弱性チェック（Rust: RustSec / フロント: pnpm audit）。
  # フロントは配布物が静的ビルド済みアセットのため、本番に同梱される依存だけを
  # --prod でゲートする（dev サーバ専用の指摘で CI を赤くしない）。
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      # プリビルドの cargo-audit を取得（cargo install のコンパイル待ちを避ける）。
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: cargo-audit
      - name: cargo audit（アプリシェル）
        run: cargo audit --file src-tauri/Cargo.lock
      - name: cargo audit（コアクレート）
        run: cargo audit --file crates/core/Cargo.lock
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit（本番依存のみ）
        run: pnpm audit --prod
